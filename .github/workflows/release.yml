name: Release

# Cutting a release = push an annotated tag vX.Y.Z (see docs/releasing.md).
# This builds the all-in-one container image with the version injected, pushes it to GHCR
# and Docker Hub, and creates a GitHub release with notes from CHANGELOG.md and the pinned
# Docker Compose deployment artifact attached.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # Validates the tag and fails fast when CHANGELOG.md has no section for it.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid semver release tag (vX.Y.Z[-prerelease])"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require changelog section
        run: scripts/release/extract-changelog.sh "${{ steps.version.outputs.version }}" > /dev/null

  # Release gates: the same checks that run on PRs/master.
  # `full` is mandatory here. ci.yml skips jobs on plain master pushes, and inside a
  # reusable workflow `github.event_name` reports the CALLER's event — a release is a tag
  # push, so an event-based check would read 'push' and silently skip the very jobs this
  # gate exists to run. The explicit input is what keeps the gate complete.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # One image per release: the all-in-one container (deploy/allinone/Dockerfile), published
  # to both registries from a single build so tags and digests match. The per-service
  # Dockerfiles still exist for the source-built dev/e2e/perf composes; they are not shipped.
  publish-image:
    needs: [meta, ci, e2e]
    runs-on: ubuntu-latest
    env:
      # Docker Hub account the image is published under — it is both the login and the
      # namespace, so the image reads `proxytrace/proxytrace`. A plain (free) account: Hub
      # organisations are a paid feature and buy nothing we need. Auth is its PAT, in the
      # DOCKER_HUB_PAT repo secret.
      DOCKERHUB_USERNAME: proxytrace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU lets the amd64 runner emulate arm64 for the multi-arch build below.
      # The heavy compile steps cross-compile natively (the Dockerfile pins its build
      # stages to --platform=$BUILDPLATFORM); emulation only runs the arm64 runtime
      # stage's apt install.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The PAT needs Read & Write; proxytrace/proxytrace is auto-created (public) on first push.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Tags X.Y.Z, X.Y, X and latest; prerelease tags (e.g. 1.2.0-rc.1) get only
      # their exact version — metadata-action suppresses the rolling tags for them.
      # Both registries get the identical tag set from this one build.
      - name: Compute image tags
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/nordsteinsoftware/proxytrace
            docker.io/${{ env.DOCKERHUB_USERNAME }}/proxytrace
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/allinone/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          # Registry cache, not `type=gha`: this build and ci.yml's `image` job together held
          # 8.4 GB of the repo-wide 10 GB Actions cache budget and LRU-evicted the .NET and npm
          # caches every other job restores from. GHCR storage for a public package is free and
          # uncapped. Separate ref from ci.yml's: this build is multi-arch, and mixing the two
          # would have each evict the other's platform layers.
          cache-from: type=registry,ref=ghcr.io/nordsteinsoftware/proxytrace-buildcache:release-allinone
          cache-to: type=registry,ref=ghcr.io/nordsteinsoftware/proxytrace-buildcache:release-allinone,mode=max,ignore-error=true

      # Keeps the Docker Hub repo page from being an empty shell: pushes a short overview +
      # the product's short description. Non-fatal — a failure here must not fail a release
      # whose image is already published.
      - name: Sync Docker Hub repo description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/proxytrace
          short-description: "Proxytrace — trace, test and improve your AI agents. Self-hosted, one container."
          readme-filepath: scripts/release/dockerhub-overview.md

  release:
    needs: [meta, publish-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes
        run: scripts/release/extract-changelog.sh "${{ needs.meta.outputs.version }}" > release-notes.md

      # The shipped compose file is fully pinned to this release; the in-repo copy
      # tracks `latest` for tip-of-tree testing.
      # The zip name is constant (no version) so the stable download URL
      # `releases/latest/download/proxytrace.zip` always resolves; the folder
      # inside and the release tag in per-version URLs carry the version.
      - name: Package deployment artifact
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p "dist/proxytrace-$VERSION"
          sed "s/\${PROXYTRACE_VERSION:-latest}/$VERSION/" deploy/docker-compose.yml \
            > "dist/proxytrace-$VERSION/docker-compose.yml"
          cp deploy/.env.example deploy/README.md "dist/proxytrace-$VERSION/"
          cd dist && zip -r "proxytrace.zip" "proxytrace-$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          # Created as a draft: hidden from the public Releases API (so running
          # installations' update banner won't see it) until a human publishes it
          # in the GitHub UI. Images are already on GHCR at this point.
          gh release create "v$VERSION" $PRERELEASE --draft \
            --title "Proxytrace $VERSION" \
            --notes-file release-notes.md \
            "dist/proxytrace.zip"
