name: CodeQL

# Static analysis via GitHub code scanning. Findings appear in the repo's
# Security tab; a PR fails its check when it introduces new alerts.
# Every language is analyzed with build-mode `none` (no compilation needed), so this
# stays fast. Python is deliberately excluded — only stray helper scripts.
#
# The language matrix is computed from the diff rather than fixed: analysing C# on a
# frontend-only PR costs ~3 minutes and can only reproduce the previous run's findings.
# The weekly schedule and every master push still analyse everything, so the Security
# tab's baseline never drifts from a partial scan.

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly re-scan so new CodeQL query releases surface findings
    # without waiting for the next commit.
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.resolve.outputs.languages }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/detect-changes

      - name: Resolve the language set
        id: resolve
        env:
          DETECTED: ${{ steps.detect.outputs.codeql-languages }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # Only a PR may analyse a subset. A master push or the weekly schedule feeds the
          # Security tab's baseline, and a partial scan there would read as "alert resolved"
          # for every language that did not run.
          if [[ "$IS_PR" == "true" ]]; then
            echo "languages=${DETECTED}" >> "$GITHUB_OUTPUT"
          else
            echo 'languages=["csharp","javascript-typescript","actions"]' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: changes
    if: ${{ needs.changes.outputs.languages != '[]' }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # The fallback is never analysed — it exists because an empty matrix vector is a
        # job error in Actions, not a skip, and `if` above is what actually stops the run.
        language: ${{ fromJSON(needs.changes.outputs.languages != '[]' && needs.changes.outputs.languages || '["csharp"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # C# is analysed source-only (build-mode: none); the submodule carries Core's .cs
          # files, so without it Core would silently drop out of Proxytrace's scan.
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
