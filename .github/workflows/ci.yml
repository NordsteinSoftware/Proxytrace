name: CI

on:
  pull_request:
  push:
    branches:
      - master
  # Reused as a release gate by release.yml, which passes full=true.
  workflow_call:
    inputs:
      full:
        description: >-
          Run every job unconditionally, ignoring both the path gates and the
          master-push trim. The release gate sets this.
        type: boolean
        default: false

# Supersede in-flight runs on PR force-push/amend only; master pushes and
# release-gate (workflow_call) runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Needed by the `image` job to read/write the build cache on GHCR.
permissions:
  contents: read
  packages: write

env:
  # Build cache lives in a registry, NOT in the Actions cache. Two `type=gha,mode=max`
  # image builds previously held 8.4 GB of the repo-wide 10 GB Actions budget and
  # LRU-evicted the .NET and npm caches that `backend` and `frontend` restore from.
  # GHCR storage for a public package is free and uncapped, so the two caches no
  # longer compete. Owned by this repo (not the release image's `proxytrace` org)
  # so the workflow's own GITHUB_TOKEN is unambiguously allowed to write it.
  BUILD_CACHE: ghcr.io/nordsteinsoftware/proxytrace-buildcache

jobs:
  # Decides which of the jobs below can be skipped. Fails open — see the action.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      image: ${{ steps.detect.outputs.image }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/detect-changes

  # A secret can be committed to any file, so this is never path-gated. It is skipped
  # on master pushes only because the PR run already scanned the same history.
  secrets:
    if: ${{ inputs.full || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs the gitleaks binary directly: gitleaks-action requires a paid license key
      # for organization-owned repos. Config + allowlisted fixtures: .gitleaks.toml.
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  # Kept on master pushes for the same reason as `backend`: the Vitest suite is the
  # post-merge safety net for a PR that was verified against a stale base. Lint and
  # build cannot break from a merge-order interaction on their own, but they share this
  # job's `npm ci`, so they ride along rather than paying for a second install.
  frontend:
    needs: changes
    if: ${{ inputs.full || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # Vitest unit/component suite. `pretest` regenerates the docs index from manual/,
      # so this also catches a manual edit that breaks Tracey's search_docs fixture.
      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # Kept on master pushes as the post-merge safety net: a PR verified against a stale
  # base can still break master, and the tests are what catch that.
  backend:
    needs: changes
    if: ${{ inputs.full || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    # A wedged test (a mocked call that never matches leaves the consume loop spinning) otherwise
    # runs to GitHub's 6h default. The suite finishes in a few minutes; 30 leaves ample headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore Proxytrace.sln --nologo

      - name: Build
        run: dotnet build Proxytrace.sln --nologo --no-restore

      # PROXYTRACE_REQUIRE_DOCKER_TESTS turns the container-backed tests (currently the real-Redis
      # ingestion transport ones) from skip-if-unavailable into hard failures. They must stay
      # skippable locally so `dotnet test` never requires Docker, but a runner that quietly lost its
      # container runtime would then drop exactly the coverage those tests exist to guarantee.
      - name: Test
        run: dotnet test Proxytrace.sln --nologo --verbosity minimal --no-restore
        env:
          PROXYTRACE_REQUIRE_DOCKER_TESTS: true

  # Builds the released all-in-one image and boots it, so a container that fails to come up
  # (initdb, supervisord, nginx upstream, migrations on a cold volume) is caught here rather
  # than after a release tag is pushed. Single-arch: the release build adds arm64.
  # Skipped on master pushes — packaging cannot regress from merge order alone.
  image:
    needs: changes
    if: ${{ inputs.full || (github.event_name == 'pull_request' && needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache reads work anonymously; only the write needs this. Fork PRs get a
      # read-only token, so the login fails and `ignore-error` drops the export.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/allinone/Dockerfile
          load: true
          tags: proxytrace:ci
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}:allinone
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }}:allinone,mode=max,ignore-error=true

      # A cold volume: initdb runs, migrations apply, then all five processes must answer.
      - name: Smoke-test the container
        run: |
          docker run -d --name proxytrace -p 5101:80 -p 5102:8081 -v proxytrace-data:/data proxytrace:ci
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' proxytrace)
            [[ "$status" == "healthy" ]] && break
            [[ "$status" == "unhealthy" ]] && break
            sleep 5
          done
          docker logs proxytrace
          [[ "$(docker inspect -f '{{.State.Health.Status}}' proxytrace)" == "healthy" ]] \
            || { echo "::error::container never became healthy"; exit 1; }
          # The UI, the bundled manual, the API behind nginx, and the ingestion proxy.
          curl -fsS -o /dev/null http://localhost:5101/
          curl -fsS -o /dev/null http://localhost:5101/docs/
          curl -fsS -o /dev/null http://localhost:5101/api/health
          curl -fsS -o /dev/null http://localhost:5102/health
