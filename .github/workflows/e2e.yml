name: E2E

# 98% of merges touch backend or frontend, so this suite is deliberately NOT gated on
# changed paths — it would almost never skip, and skipping it wrongly is expensive.
# Only a diff that is purely prose can miss it. Note that `paths-ignore` does not apply
# to `workflow_call`, so the release gate always runs the suite.
#
# The two lists below are duplicated rather than shared via a YAML anchor: the Actions
# workflow parser does not support anchors/aliases. Keep them in sync by hand.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'manual/**'
      - '**.md'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'manual/**'
      - '**.md'
  # Reused as a release gate by release.yml (which passes secrets via `secrets: inherit`).
  workflow_call:

# Supersede in-flight runs on PR force-push/amend only; master pushes and
# release-gate (workflow_call) runs are never cancelled.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Needed to read/write the stack's build cache on GHCR.
permissions:
  contents: read
  packages: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_CACHE: ghcr.io/nordsteinsoftware/proxytrace-buildcache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache reads work anonymously; only the write needs this. Fork PRs get a
      # read-only token, so the login fails and `ignore-error` drops the export.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # COMPOSE_BAKE routes the build through buildx bake, which is what honours the
      # cache_from/cache_to keys in the ci-cache overlay.
      - name: Boot e2e stack
        env:
          COMPOSE_BAKE: "1"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            -f docker-compose.ci-cache.yml \
            up --build -d --wait
        timeout-minutes: 15

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps
        working-directory: e2e

      - name: Run core + smoke + auth tests
        run: npx playwright test --project=core --project=smoke --project=auth-flows
        working-directory: e2e

      - name: Run LLM tests
        if: env.OPENAI_API_KEY != ''
        run: >-
          npx playwright test
          --project=llm-ingestion
          --project=llm-proxy-trace
          --project=llm-test-run
          --project=llm-playground
          --project=llm-evaluator-playground
        working-directory: e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      # Runs before teardown: `down -v` destroys the containers and with them every
      # stack-side clue about why a spec failed (crash, restart, hang, 502 from nginx).
      - name: Capture e2e stack logs
        if: failure()
        run: |
          compose() {
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml "$@"
          }
          mkdir -p stack-logs
          # Container states — exit codes, restart counts, health. Echoed into the job log
          # too, so the common cases need no artifact download at all.
          compose ps -a | tee stack-logs/compose-ps.txt || true
          # Combined log for cross-service correlation, plus one file per service because
          # the interleaved dump is unreadable at volume.
          compose logs --no-color --timestamps > stack-logs/compose-logs.txt 2>&1 || true
          for service in $(compose config --services); do
            compose logs --no-color --timestamps "$service" \
              > "stack-logs/$service.log" 2>&1 || true
            # …and a bounded tail of each into the job log, inside a collapsed group. A container
            # that died takes its "why" with it, and the artifact is not always reachable from the
            # environment triaging the run (#522) — the last 200 lines carry the stack trace, the
            # failed migration or the shutdown reason, so the common cases stay diagnosable from
            # the run page alone.
            echo "::group::$service (last 200 log lines)"
            tail -n 200 "stack-logs/$service.log" || true
            echo "::endgroup::"
          done
          # Restart counts, exit codes, OOMKilled — the "did it crash or hang?" evidence.
          compose ps -aq | xargs -r docker inspect \
            > stack-logs/docker-inspect.json 2>&1 || true

      - name: Upload e2e stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stack-logs
          path: stack-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down e2e stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
